[package]
name = "KuGou"
version = "0.1.0"
edition = "2021"
description = "酷狗音乐 API 的本地 Rust 实现（直连上游，含签名与加解密）"

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 加密
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
rsa = { version = "0.9", features = ["sha2"] }
num-bigint = "0.4"
rand = "0.8"

# 工具
thiserror = "1"
urlencoding = "2"
flate2 = "1"

# FFI：版本必须与 flutter_rust_bridge_codegen 完全一致
flutter_rust_bridge = "=2.13.0"

[lib]
name = "kugou"
# cdylib/staticlib 供 Flutter 各平台链接；rlib 供 Rust 自身（测试与 bin）
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "KuGou"
path = "src/main.rs"

# 继承 workspace 根的 lint 配置（见 ../Cargo.toml）
[lints]
workspace = true

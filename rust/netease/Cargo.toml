[package]
name = "netease"
version = "0.1.0"
edition = "2021"
description = "网易云音乐 API 的本地 Rust 实现（直连上游，含 weapi/eapi/xeapi 加密）"

[dependencies]
# ⚠️ 必须显式用 rustls，不能走默认的 native-tls：
#    native-tls 在 Android 上落到 OpenSSL，而 NDK 不提供可链接的 OpenSSL，
#    交叉编译会直接失败。rustls 是纯 Rust，无 C 依赖。
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# ⚠️ preserve_order：JS 的 JSON.stringify 保持插入顺序，weapi/eapi 的明文要与之对齐
serde_json = { version = "1", features = ["preserve_order"] }

# 加密原语
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
num-bigint = "0.4"
rand = "0.8"

# xeapi（X25519 + AES-GCM + HKDF）
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
# xeapi 响应可能是 gzip
flate2 = "1"

# 工具
thiserror = "1"
urlencoding = "2"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 有序 map：Cookie 的顺序会影响服务端解析与风控特征
indexmap = { version = "2", features = ["serde"] }

# FFI：版本必须与 flutter_rust_bridge_codegen 完全一致
flutter_rust_bridge = "=2.13.0"

[lib]
name = "netease"
# cdylib/staticlib 供 Flutter 各平台链接；rlib 供 Rust 自身（测试与 bin）
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "netease"
path = "src/main.rs"

# 继承 workspace 根的 lint 配置（见 ../Cargo.toml）
[lints]
workspace = true
